<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>胶东传统村落数字博物馆</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>胶东传统村落数字博物馆</h1>
        <input type="text" id="search" placeholder="输入村落名称搜索">
    </header>

    <div class="village-list">
        <!-- 烟台市招远市辛庄镇高家庄子村 -->
        <a href="villages/gaojiazhuangzi.html" class="village-card">

                <h2>烟台市招远市辛庄镇高家庄子村</h2>

            </div>
        </a>

        <!-- 烟台市招远市辛庄镇大涝洼村 -->
        <a href="villages/dalaowa.html" class="village-card">
            <img src="images/大涝洼村1.jpg" alt="大涝洼村">
            <div class="info">
                <h2>烟台市招远市辛庄镇大涝洼村</h2>
                <p>中国传统村落</p>
                <p>📍 坐标：120.216694, 37.480501</p>
            </div>

        <!-- 其他村落按相同格式添加 -->
    </div>
